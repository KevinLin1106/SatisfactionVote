<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滿意度調查 - 統計面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans">
    
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📊 滿意度調查統計面板</h1>
            <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                重新整理資料
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="py-3 px-4 border-b text-left text-sm font-semibold text-gray-700">單位</th>
                        <th class="py-3 px-4 border-b text-left text-sm font-semibold text-gray-700">窗口</th>
                        <th class="py-3 px-4 border-b text-center text-sm font-semibold text-gray-700">非常滿意 😊</th>
                        <th class="py-3 px-4 border-b text-center text-sm font-semibold text-gray-700">滿意 🙂</th>
                        <th class="py-3 px-4 border-b text-center text-sm font-semibold text-gray-700">普通 😐</th>
                        <th class="py-3 px-4 border-b text-center text-sm font-semibold text-gray-700">不滿意 🙁</th>
                        <th class="py-3 px-4 border-b text-center text-sm font-semibold text-gray-700">非常不滿意 😠</th>
                        <th class="py-3 px-4 border-b text-center text-sm font-semibold text-gray-700 bg-blue-50">總票數</th>
                        <th class="py-3 px-4 border-b text-center text-sm font-semibold text-gray-700 bg-red-50">擋下灌票數</th>
                    </tr>
                </thead>
                <tbody id="stats-table-body" class="divide-y divide-gray-200">
                    <!-- 資料將透過 JavaScript 動態載入於此 -->
                    <tr>
                        <td colspan="8" class="py-10 text-center text-gray-500">資料載入中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 貼上你的 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyBMHunuQAkbr8e0O-1DhEC7BKYOyNpE76w",
            authDomain: "satisfaction-58c97.firebaseapp.com",
            projectId: "satisfaction-58c97",
            storageBucket: "satisfaction-58c97.firebasestorage.app",
            messagingSenderId: "265026209433",
            appId: "1:265026209433:web:5225f99e256b47ead6da08"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2分鐘的毫秒數 (120,000 毫秒)
        const COOLDOWN_MS = 120000;

        async function loadStats() {
            const tbody = document.getElementById('stats-table-body');
            // 注意：這裡多加了一個 <th>對應的 colspan，配合新增的過濾欄位
            tbody.innerHTML = '<tr><td colspan="9" class="py-10 text-center text-gray-500">資料載入與分析中...</td></tr>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "surveys"));
                
                // 將資料轉為陣列，過濾掉沒有時間戳記的異常資料
                let docsArray = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.timestamp) {
                        docsArray.push(data);
                    }
                });

                // 核心步驟 1：依據時間先後順序排序 (舊 -> 新)
                docsArray.sort((a, b) => a.timestamp.toMillis() - b.timestamp.toMillis());

                const statsMap = {};
                const lastValidVoteTime = {}; // 用來記錄各窗口「最後一次有效票」的時間

                // 核心步驟 2：遍歷檢查與加總
                docsArray.forEach((data) => {
                    const unit = data.unit || '未知單位';
                    const win = data.window || '未知窗口';
                    const satisfaction = data.satisfaction;
                    const currentTime = data.timestamp.toMillis();
                    
                    const key = `${unit}_${win}`;

                    if (!statsMap[key]) {
                        statsMap[key] = {
                            unit: unit,
                            window: win,
                            total: 0,
                            invalidTotal: 0, // 記錄被過濾的票數
                            counts: {
                                "非常滿意": 0, "滿意": 0, "普通": 0, "不滿意": 0, "非常不滿意": 0
                            }
                        };
                        lastValidVoteTime[key] = 0;
                    }

                    // 檢查是否距離上一張有效票超過 2 分鐘
                    if (currentTime - lastValidVoteTime[key] < COOLDOWN_MS && lastValidVoteTime[key] !== 0) {
                        // 兩分鐘內的重複投票 -> 判定為無效，過濾數 +1，跳過後續加總
                        statsMap[key].invalidTotal++;
                        return; 
                    }

                    // 距離超過兩分鐘 -> 判定為有效票
                    lastValidVoteTime[key] = currentTime; // 更新該窗口最後一次有效投票的時間
                    
                    if (statsMap[key].counts[satisfaction] !== undefined) {
                        statsMap[key].counts[satisfaction]++;
                        statsMap[key].total++;
                    }
                });

                tbody.innerHTML = ''; 
                const statsArray = Object.values(statsMap);
                
                if (statsArray.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="py-10 text-center text-gray-500">目前還沒有任何問卷資料。</td></tr>';
                    return;
                }

                statsArray.sort((a, b) => a.unit.localeCompare(b.unit) || a.window.localeCompare(b.window));

                statsArray.forEach(stat => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition duration-150";
                    
                    tr.innerHTML = `
                        <td class="py-3 px-4 whitespace-nowrap font-medium text-gray-800">${stat.unit}</td>
                        <td class="py-3 px-4 whitespace-nowrap text-gray-600">${stat.window}</td>
                        <td class="py-3 px-4 text-center text-gray-600">${stat.counts["非常滿意"]}</td>
                        <td class="py-3 px-4 text-center text-gray-600">${stat.counts["滿意"]}</td>
                        <td class="py-3 px-4 text-center text-gray-600">${stat.counts["普通"]}</td>
                        <td class="py-3 px-4 text-center text-gray-600">${stat.counts["不滿意"]}</td>
                        <td class="py-3 px-4 text-center text-gray-600">${stat.counts["非常不滿意"]}</td>
                        <td class="py-3 px-4 text-center font-bold text-blue-600 bg-blue-50/50">${stat.total}</td>
                        <td class="py-3 px-4 text-center font-bold text-red-500 bg-red-50/30" title="2分鐘內重複送出的無效票">${stat.invalidTotal}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("載入統計資料失敗:", error);
                tbody.innerHTML = '<tr><td colspan="9" class="py-10 text-center text-red-500">載入失敗，請檢查 Firebase 設定或網路連線。</td></tr>';
            }
        }

        document.getElementById('refresh-btn').addEventListener('click', loadStats);
        window.onload = loadStats;
    </script>
</body>
</html>
